name: sheng-final-psci-repack

on:
  workflow_dispatch:
    inputs:
      artifact_token:
        description: "temporary token for reading the existing private artifact"
        required: true
        type: string

permissions:
  contents: read

jobs:
  repack:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      WORK: ${{ github.workspace }}/work
      DIAG: ${{ github.workspace }}/out/diag/probe
      GHTOKEN: ${{ inputs.artifact_token }}
    steps:
      - name: checkout fixed repack scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: repack with upstream copy-cache path and final PSCI
        run: |
          set -euo pipefail
          mkdir -p "$DIAG"
          exec > >(tee -a "$DIAG/build.log") 2>&1
          brew install llvm lld
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          clang --version
          ld.lld --version
          type -a clang ld.lld llvm-objcopy
          ls -l /opt/homebrew/opt/lld/bin/ld.lld /opt/homebrew/opt/llvm/bin/clang
          python3 "$GITHUB_WORKSPACE/.github/scripts/fetch_direct_inputs.py"
          python3 "$GITHUB_WORKSPACE/.github/scripts/repack_final_psci.py"
          shasum -a 256 "$DIAG/probe-final-psci.img" "$DIAG/report.json"

      - name: upload final PSCI image and complete logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-final-psci-${{ github.run_id }}
          path: out/diag/probe/**
          if-no-files-found: error
          retention-days: 14
