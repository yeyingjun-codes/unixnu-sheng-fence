name: codemagic-token-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync sheng secrets to Codemagic app
        env:
          CODEMAGIC_TOKEN: ${{ secrets.CODEMAGIC_TOKEN_1 }}
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          SEED_PASSPHRASE: ${{ secrets.SEED_PASSPHRASE }}
          GHTOKEN: ${{ secrets.GHTOKEN }}
          CODEMAGIC_APP_ID: 6afb4c09e215a04a9aafd0fd
        run: |
          set -euo pipefail
          if [ -z "${CODEMAGIC_TOKEN:-}" ]; then
            echo 'CODEMAGIC_TOKEN_1 secret is missing' >&2
            exit 1
          fi
          if [ -z "${UNIXNU_UNIQUE_CHIP_ID:-}" ] || [ -z "${SEED_PASSPHRASE:-}" ]; then
            echo 'UNIXNU_UNIQUE_CHIP_ID or SEED_PASSPHRASE GitHub secret is missing' >&2
            exit 1
          fi
          if [ -z "${GHTOKEN:-}" ]; then
            echo 'GHTOKEN GitHub secret is missing' >&2
            exit 1
          fi
          echo "::add-mask::${CODEMAGIC_TOKEN}"
          echo "::add-mask::${UNIXNU_UNIQUE_CHIP_ID}"
          echo "::add-mask::${SEED_PASSPHRASE}"
          echo "::add-mask::${GHTOKEN}"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ['CODEMAGIC_TOKEN']
          app_id = os.environ['CODEMAGIC_APP_ID']
          values = {
              'UNIXNU_UNIQUE_CHIP_ID': os.environ['UNIXNU_UNIQUE_CHIP_ID'],
              'SEED_PASSPHRASE': os.environ['SEED_PASSPHRASE'],
              # prepare-xnu-source.py uses this for authenticated Apple source downloads.
              'GITHUB_TOKEN': os.environ['GHTOKEN'],
          }
          headers = {
              'x-auth-token': token,
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'User-Agent': 'sheng-codemagic-secrets',
          }
          def scrub(text):
              for value in [token, *values.values()]:
                  if value:
                      text = text.replace(value, '***')
              return text[:2000]
          for key, value in values.items():
              payload = {'key': key, 'value': value, 'group': 'sheng-secrets', 'secure': True}
              req = urllib.request.Request(
                  f'https://api.codemagic.io/apps/{app_id}/variables',
                  data=json.dumps(payload).encode(), headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=90) as resp:
                      body = resp.read().decode('utf-8', 'replace')
                      status = resp.status
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', 'replace')
                  status = e.code
              print(f'{key}: status={status} body={scrub(body)}')
              if status not in (200, 201, 202):
                  raise SystemExit(1)
          PY
