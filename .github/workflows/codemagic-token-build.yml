name: codemagic-token-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Start and watch Codemagic build
        env:
          CODEMAGIC_TOKEN: ${{ secrets.CODEMAGIC_TOKEN_1 }}
          CODEMAGIC_APP_ID: 6afb4c09e215a04a9aafd0fd
          CODEMAGIC_WORKFLOW_ID: sheng-package27
          CODEMAGIC_BRANCH: main
        run: |
          set -euo pipefail
          if [ -z "${CODEMAGIC_TOKEN:-}" ]; then
            echo 'CODEMAGIC_TOKEN_1 secret is missing' >&2
            exit 1
          fi
          echo "::add-mask::${CODEMAGIC_TOKEN}"
          cat > cm_build.py <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          from pathlib import Path

          TOKEN = os.environ['CODEMAGIC_TOKEN']
          APP = os.environ['CODEMAGIC_APP_ID']
          WORKFLOW = os.environ['CODEMAGIC_WORKFLOW_ID']
          BRANCH = os.environ['CODEMAGIC_BRANCH']
          BASE = 'https://codemagic.io/api/v3'
          LEGACY = 'https://api.codemagic.io'
          HEADERS = {'x-auth-token': TOKEN, 'Content-Type': 'application/json', 'Accept': 'application/json', 'User-Agent': 'sheng-cm-build'}
          OUT = Path('codemagic-output')
          OUT.mkdir(exist_ok=True)

          def scrub(text):
              return text.replace(TOKEN, '***')[:4000]

          def request(method, url, payload=None, raw=False):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=HEADERS, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      body = resp.read()
                      if raw:
                          return resp.status, body
                      return resp.status, body.decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  body = e.read()
                  if raw:
                      return e.code, body
                  return e.code, body.decode('utf-8', 'replace')

          def find_build_id(value):
              if isinstance(value, dict):
                  for key in ('_id', 'id', 'buildId', 'build_id'):
                      item = value.get(key)
                      if isinstance(item, str) and len(item) >= 12:
                          return item
                  for item in value.values():
                      found = find_build_id(item)
                      if found:
                          return found
              elif isinstance(value, list):
                  for item in value:
                      found = find_build_id(item)
                      if found:
                          return found
              return None

          status, body = request('POST', f'{BASE}/apps/{APP}/builds', {'workflow_id': WORKFLOW, 'branch': BRANCH})
          print('start_v3_status=', status, flush=True)
          print('start_v3_body=', scrub(body), flush=True)
          build_id = None
          if status in (200, 201, 202):
              try:
                  build_id = find_build_id(json.loads(body))
              except Exception:
                  pass
          if not build_id:
              status2, body2 = request('POST', f'{LEGACY}/builds', {'appId': APP, 'workflowId': WORKFLOW, 'branch': BRANCH})
              print('start_legacy_status=', status2, flush=True)
              print('start_legacy_body=', scrub(body2), flush=True)
              if status2 in (200, 201, 202):
                  build_id = find_build_id(json.loads(body2))
          if not build_id:
              raise SystemExit('Codemagic build did not return a build id')
          print('build_id=' + build_id, flush=True)
          (OUT / 'build-id.txt').write_text(build_id + '\n')

          last = None
          deadline = time.time() + 150 * 60
          final = None
          while time.time() < deadline:
              status, body = request('GET', f'{BASE}/builds/{build_id}')
              if status != 200:
                  print('poll_status=', status, scrub(body), flush=True)
                  time.sleep(30)
                  continue
              data = json.loads(body).get('data', {})
              state = data.get('status')
              if state != last:
                  print(f"build_status={state} instance={data.get('instance_type')} queued={data.get('queued_at')} started={data.get('started_at')}", flush=True)
                  last = state
              # Codemagic v3 reports successful completion as "finished"; failures use "failed".
              if state in ('success', 'finished', 'failed', 'canceled', 'timeout'):
                  final = data
                  break
              time.sleep(30)
          if final is None:
              raise SystemExit('Codemagic watch timed out')

          status, actions_body = request('GET', f'{BASE}/builds/{build_id}/actions')
          actions = json.loads(actions_body).get('data', []) if status == 200 else []
          print('steps=', len(actions), flush=True)
          for action in actions:
              print('step', action.get('status'), action.get('name'), flush=True)
          status, legacy_body = request('GET', f'{LEGACY}/builds/{build_id}')
          if status == 200:
              legacy = json.loads(legacy_body).get('build', {})
              print('legacy_status=', legacy.get('status'), 'message=', legacy.get('message'), flush=True)

          summary = {'build_id': build_id, 'final': final, 'actions': actions}
          (OUT / 'summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False))
          artifacts = final.get('artifacts') or []
          print('artifacts=', len(artifacts), flush=True)
          for artifact in artifacts:
              name = artifact.get('name') or 'artifact'
              size = artifact.get('size_in_bytes') or 0
              url = artifact.get('short_lived_download_url')
              print('artifact', name, size, 'download=', bool(url), flush=True)
              if not url:
                  continue
              target = OUT / name
              req = urllib.request.Request(url, headers={'x-auth-token': TOKEN, 'User-Agent': 'sheng-cm-build'})
              try:
                  with urllib.request.urlopen(req, timeout=600) as resp:
                      target.write_bytes(resp.read())
              except Exception:
                  with urllib.request.urlopen(url, timeout=600) as resp:
                      target.write_bytes(resp.read())
              print('downloaded', name, target.stat().st_size, flush=True)
          successful = final.get('status') in ('success', 'finished') and not any(
              action.get('status') not in ('success', 'skipped') for action in actions)
          if not successful:
              raise SystemExit(1)
          PY
          python3 cm_build.py
      - name: Upload Codemagic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codemagic-token1-build-output
          retention-days: 2
          if-no-files-found: warn
          path: |
            codemagic-output/**
