# Codemagic port of .github/workflows/package.yml.
#
# Recipe (docs §7.5, §9.2):
#   device tree  = yeyingjun-codes/unixnu-sheng-fence @ main  (= 571fcc97, 47 kernel args,
#                  os_profile ipados-27.0.1-24A446, package/WifiFirmware.c present)
#   UniXNU       = 82b847c4ac3f68a57024b3082ffa3a03442defd9
#   Adreno740    = yeyingjun-codes/adreno740-fence @ 0b28a0e5 (= 6fa7bae + fa4f4aa + 653e11c)
#   Data seed    = seed/data.dbr.enc, AES-256-CBC/pbkdf2, passphrase in SEED_PASSPHRASE
#
# Secrets (app variable group "sheng-secrets", secure): UNIXNU_UNIQUE_CHIP_ID, SEED_PASSPHRASE.
# board.toml names ../UniXNU and ../uefi-sheng relative to itself, so all three checkouts live
# as siblings under $CM_BUILD_DIR/work.

workflows:
  sheng-package27:
    name: sheng package 27 (Adreno740 fence fix)
    instance_type: mac_mini_m2
    max_build_duration: 360
    environment:
      groups:
        - sheng-secrets
      vars:
        WORK: "$CM_BUILD_DIR/work"
        UNIXNU_REF: 82b847c4ac3f68a57024b3082ffa3a03442defd9
        DEVICE_REPO: https://github.com/yeyingjun-codes/unixnu-sheng-fence.git
        DEVICE_REF: main
        UEFI_REPO: https://github.com/UniXNU/uefi-sheng.git
        UEFI_REF: sheng
        ADRENO740_REPO: https://github.com/yeyingjun-codes/adreno740-fence.git
        ADRENO740_REV: 0b28a0e5b66501f55d71a885ab3f5f21467755a1
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      xcode: latest
    scripts:
      - name: runner info and disk headroom
        script: |
          set -euo pipefail
          sw_vers; uname -m
          df -h / | tail -2
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$newest" ]; then
            echo "selecting $newest"; sudo xcode-select -s "$newest/Contents/Developer" || true
          fi
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          sudo rm -rf /Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
          df -h / | tail -2

      - name: host toolchain
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:/opt/homebrew/opt/bison/bin:$HOME/.cargo/bin:$PATH"
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          printf '%s\n' "/opt/homebrew/opt/llvm/bin" "/opt/homebrew/opt/lld/bin" "/opt/homebrew/opt/bison/bin" "$HOME/.cargo/bin" >> "$CM_ENV"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw cargo rustc; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          python3 -c 'import tomllib,sys; print("python", sys.version.split()[0])'
          [ "$ok" = 1 ]
          sw_vers; xcodebuild -version; uname -m

      - name: checkout the three trees as siblings
        script: |
          set -euo pipefail
          mkdir -p "$WORK"
          cd "$WORK"
          git clone --depth 1 --branch "$DEVICE_REF" --recurse-submodules --shallow-submodules "$DEVICE_REPO" device
          git clone --depth 1 --branch "$UEFI_REF" --recurse-submodules --shallow-submodules "$UEFI_REPO" uefi-sheng
          git init -q UniXNU
          git -C UniXNU remote add origin https://github.com/UniXNU/UniXNU.git
          git -C UniXNU fetch --depth 1 origin "$UNIXNU_REF"
          git -C UniXNU checkout -q FETCH_HEAD
          git -C UniXNU submodule update --init --recursive --depth 1
          echo "device   $(git -C device rev-parse HEAD)"
          echo "uefi     $(git -C uefi-sheng rev-parse HEAD)"
          echo "uniXNU   $(git -C UniXNU rev-parse HEAD)"
          ls -1 "$WORK"

      - name: verify the device tree is the T0 baseline
        script: |
          set -euo pipefail
          cd "$WORK/device"
          python3 - <<'PY'
          import pathlib, sys, tomllib
          board = tomllib.load(open('board.toml', 'rb'))
          args = board['payload']['kernel_args']
          profile = board['payload'].get('os_profile') or board.get('os_profile')
          print('kernel_args =', len(args))
          print('os_profile  =', profile)
          bad = []
          if len(args) != 47:
              bad.append('kernel_args is %d, expected 47 (wrong device tree)' % len(args))
          if profile != 'ipados-27.0.1-24A446':
              bad.append('os_profile is %r, expected ipados-27.0.1-24A446' % (profile,))
          for f in ('package/WifiFirmware.c', 'package/BootWatchdogPolicy.c', 'scripts/package.sh', 'seed/data.dbr.enc'):
              if not pathlib.Path(f).is_file():
                  bad.append('missing ' + f)
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('device tree matches the T0 baseline')
          PY
          grep -A7 'id = "Adreno740"' ../UniXNU/components.toml | head -10

      - name: platform seed sanity
        script: |
          set -euo pipefail
          if ! [[ "${UNIXNU_UNIQUE_CHIP_ID:-}" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set UNIXNU_UNIQUE_CHIP_ID (8 hex digits) in the sheng-secrets variable group.' >&2
            exit 1
          fi
          echo "platform seed present (8 hex digits)"

      - name: decrypt and install the preserved Data seed
        script: |
          set -euo pipefail
          [ -f "$WORK/device/seed/data.dbr.enc" ] || { echo 'seed/data.dbr.enc missing' >&2; exit 1; }
          [ -n "${SEED_PASSPHRASE:-}" ] || { echo 'SEED_PASSPHRASE is not set' >&2; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -in "$WORK/device/seed/data.dbr.enc" -out "$WORK/data.dbr" -pass env:SEED_PASSPHRASE
          bytes=$(wc -c < "$WORK/data.dbr")
          echo "decrypted seed: $bytes bytes"
          shasum -a 256 "$WORK/data.dbr"
          dest="$WORK/UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime"
          mkdir -p "$dest"
          cp "$WORK/data.dbr" "$dest/data.dbr"
          ls -l "$dest"

      - name: pin Adreno740 to the fence-fix revision
        script: |
          set -euo pipefail
          cd "$WORK/UniXNU"
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('components.toml')
          text = path.read_text()
          blocks = re.split(r'(?=^\[\[component\]\])', text, flags=re.M)
          hit, out = 0, []
          for block in blocks:
              if re.search(r'^id = "Adreno740"', block, re.M):
                  block = re.sub(r'^repository = ".*"', 'repository = "%s"' % os.environ['ADRENO740_REPO'], block, count=1, flags=re.M)
                  block = re.sub(r'^revision = ".*"', 'revision = "%s"' % os.environ['ADRENO740_REV'], block, count=1, flags=re.M)
                  hit += 1
              out.append(block)
          if not hit:
              raise SystemExit('Adreno740 component not found in components.toml')
          path.write_text(''.join(out))
          print('Adreno740 ->', os.environ['ADRENO740_REPO'], os.environ['ADRENO740_REV'])
          PY
          grep -A7 'id = "Adreno740"' components.toml | head -10

      - name: package
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:/opt/homebrew/opt/bison/bin:$HOME/.cargo/bin:$PATH"
          cd "$WORK/device"
          scripts/package.sh --os 27 --uefi ../uefi-sheng

      - name: collect outputs
        script: |
          set -euo pipefail
          root="$WORK/UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27"
          echo "== produced files =="
          find "$root" -maxdepth 2 -type f \( -name 'boot.img' -o -name 'payload.img' -o -name 'kernel.macho' -o -name 'package.manifest.json' \) -print -exec ls -l {} \;
          for f in boot/boot.img payload/payload.img kernel/kernel.macho package.manifest.json; do
            [ -f "$root/$f" ] || { echo "MISSING $f" >&2; exit 1; }
          done
          shasum -a 256 "$root/boot/boot.img" "$root/payload/payload.img" "$root/kernel/kernel.macho"
          mkdir -p "$CM_BUILD_DIR/out"
          cp "$root/boot/boot.img" "$CM_BUILD_DIR/out/boot.img"
          cp "$root/payload/payload.img" "$CM_BUILD_DIR/out/payload.img"
          cp "$root/kernel/kernel.macho" "$CM_BUILD_DIR/out/kernel.macho"
          cp "$root/package.manifest.json" "$CM_BUILD_DIR/out/package.manifest.json"
          if [ -f "$root/runtime/inputs.json" ]; then cp "$root/runtime/inputs.json" "$CM_BUILD_DIR/out/inputs.json"; fi
          ls -l "$CM_BUILD_DIR/out"

    artifacts:
      - out/boot.img
      - out/payload.img
      - out/kernel.macho
      - out/package.manifest.json
      - out/inputs.json
      - $CM_BUILD_DIR/work/UniXNU/out/sheng/*/*/package.manifest.json