workflows:
  sheng-official-baseline:
    name: sheng-ios17-i568-baseline
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
      - sheng-secrets
      vars:
        WORK: $CM_BUILD_DIR/work
        DIAG: $CM_BUILD_DIR/out/diag
        UNIXNU_REF: 23202419ecd7f0b54b956809b322eb2d331af3ab
        DEVICE_REPO: yeyingjun-codes/UniXNU-sheng
        DEVICE_REF: i568-official
        UEFI_REPO: https://github.com/UniXNU/uefi-sheng.git
        UEFI_REF: sheng
        ADRENO740_REPO: https://github.com/yeyingjun-codes/adreno740-fence.git
        ADRENO740_REV: 0b28a0e5b66501f55d71a885ab3f5f21467755a1
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      xcode: latest
    artifacts:
    - out/diag/*.txt
    - out/boot.img
    - out/payload.img
    - out/kernel.macho
    - out/package.manifest.json
    scripts:
    - name: environment diagnostics
      script: "set -uo pipefail\nmkdir -p \"$DIAG\"\nL=\"$DIAG/01-env.txt\"\n{\n  echo \"date: $(date -u)\"\n  echo \"user: $(id -un)  arch: $(uname -m)\"\n  sw_vers || true\n  echo \"--- Xcode ---\"\n\
        \  ls -d /Applications/Xcode*.app 2>/dev/null || echo \"no Xcode bundles\"\n  xcodebuild -version 2>&1 || true\n  echo \"sdk(iphoneos): $(xcrun --sdk iphoneos --show-sdk-version 2>&1 || true)\"\n\
        \  echo \"clang: $(clang --version 2>&1 | head -2 || true)\"\n  echo \"--- brew ---\"\n  command -v brew || true\n  brew --version 2>&1 | head -2 || true\n  echo \"brew prefix: $(brew --prefix 2>&1\
        \ || echo none)\"\n  echo \"--- disk ---\"\n  df -h / | tail -2\n  echo \"--- tool presence ---\"\n  for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool mformat\
        \ mcopy ipsw cargo rustc rustup python3 openssl; do\n    printf '%-18s %s\\n' \"$t\" \"$(command -v \"$t\" || echo MISSING)\"\n  done\n  echo \"--- python ---\"\n  python3 -c 'import tomllib,sys;print(\"\
        python\",sys.version.split()[0])' 2>&1 || true\n} > \"$L\" 2>&1\ncat \"$L\"\n"
    - name: host toolchain
      script: "set -uo pipefail\nmkdir -p \"$DIAG\"\nL=\"$DIAG/02-toolchain.txt\"\nexec > >(tee -a \"$L\") 2>&1\nexport PATH=\"/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:/opt/homebrew/opt/bison/bin:$PATH\"\
        \necho \"== brew install ==\"\nbrew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup 2>&1 | tail -30\necho \"brew install rc=$?\"\n# rustup is keg-only: its\
        \ toolchain proxies (cargo, rustc) are not linked into /opt/homebrew/bin.\nRUSTUP_BIN=\"$(brew --prefix rustup 2>/dev/null)/bin\"\necho \"rustup keg: $RUSTUP_BIN\"\n[ -x \"$RUSTUP_BIN/rustup\" ]\
        \ && export PATH=\"$RUSTUP_BIN:$PATH\"\nexport PATH=\"/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:/opt/homebrew/opt/bison/bin:$HOME/.cargo/bin:$RUSTUP_BIN:$PATH\"\nprintf '%s\\n' \"/opt/homebrew/opt/llvm/bin\"\
        \ \"/opt/homebrew/opt/lld/bin\" \"/opt/homebrew/opt/bison/bin\" \"$HOME/.cargo/bin\" \"$RUSTUP_BIN\" >> \"$CM_ENV\"\necho \"== rustup ==\"\nif command -v rustup >/dev/null; then\n  rustup toolchain\
        \ install 1.98.0 --profile minimal --component rust-src 2>&1 | tail -5\n  echo \"rustup rc=$?\"\nelse\n  echo \"rustup missing, trying rustup-init\"\n  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs\
        \ -o /tmp/rustup-init.sh && \\\n    sh /tmp/rustup-init.sh -y --default-toolchain 1.98.0 --profile minimal --component rust-src --no-modify-path 2>&1 | tail -5\n  export PATH=\"$HOME/.cargo/bin:$PATH\"\
        \nfi\necho \"== ipsw (direct release, no tap) ==\"\nif ! command -v ipsw >/dev/null; then\n  mkdir -p \"$HOME/.local/bin\"\n  curl -fL --retry 3 -o /tmp/ipsw.tar.gz \"https://github.com/blacktop/ipsw/releases/download/v3.1.741/ipsw_3.1.741_macOS_arm64.tar.gz\"\
        \ 2>&1 | tail -3\n  tar -xzf /tmp/ipsw.tar.gz -C \"$HOME/.local/bin\" && chmod +x \"$HOME/.local/bin/ipsw\"\n  export PATH=\"$HOME/.local/bin:$PATH\"\n  printf '%s\\n' \"$HOME/.local/bin\" >> \"\
        $CM_ENV\"\nfi\necho \"== verify ==\"\nok=1\nfor t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \\\n         mformat mcopy ipsw cargo rustc; do\n  if p=$(command\
        \ -v \"$t\" 2>/dev/null); then echo \"ok   $t -> $p\"; else echo \"MISS $t\"; ok=0; fi\ndone\nfor t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do\n  if [ -x \"/opt/homebrew/opt/llvm/bin/$t\"\
        \ ] || [ -x \"/opt/homebrew/opt/lld/bin/$t\" ]; then echo \"ok   $t\"; else echo \"MISS $t\"; ok=0; fi\ndone\necho \"cargo: $(cargo --version 2>&1 || echo none)\"\necho \"ok=$ok\"\nsw_vers; xcodebuild\
        \ -version 2>&1 | head -2; uname -m\n[ \"$ok\" = 1 ]\n"
    - name: checkout the three trees as siblings
      script: 'set -uo pipefail

        mkdir -p "$DIAG"

        L="$DIAG/03-checkout.txt"

        exec > >(tee -a "$L") 2>&1

        set -e

        mkdir -p "$WORK"

        cd "$WORK"

        git clone --depth 1 --branch "$DEVICE_REF" --recurse-submodules --shallow-submodules "https://x-access-token:${GITHUB_TOKEN:-}@github.com/yeyingjun-codes/UniXNU-sheng.git" device

        git clone --depth 1 --branch "$UEFI_REF" --recurse-submodules --shallow-submodules "$UEFI_REPO" uefi-sheng

        git init -q UniXNU

        git -C UniXNU remote add origin https://github.com/UniXNU/UniXNU.git

        git -C UniXNU fetch --depth 1 origin "$UNIXNU_REF"

        git -C UniXNU checkout -q FETCH_HEAD

        git -C UniXNU submodule update --init --recursive --depth 1

        echo "device   $(git -C device rev-parse HEAD)"

        echo "uefi     $(git -C uefi-sheng rev-parse HEAD)"

        echo "uniXNU   $(git -C UniXNU rev-parse HEAD)"

        ls -1 "$WORK"

        '
    - name: platform seed sanity
      script: "set -uo pipefail\nmkdir -p \"$DIAG\"\nL=\"$DIAG/05-seed-check.txt\"\nexec > >(tee -a \"$L\") 2>&1\nif ! [[ \"${UNIXNU_UNIQUE_CHIP_ID:-}\" =~ ^[0-9a-fA-F]{8}$ ]]; then\n  echo 'Set UNIXNU_UNIQUE_CHIP_ID\
        \ (8 hex digits) in the sheng-secrets variable group.' >&2\n  exit 1\nfi\necho \"platform seed present (8 hex digits)\"\n"
    - name: fix the upstream mesa patch header
      script: "# UniXNU@82b847c4 ships patches/mesa/turnip-frame-diagnostics.patch whose first file\n# (\"tu_frame_diagnostic.h\") is a new file but carries no \"new file mode\" line. With -p1\n# git strips\
        \ \"--- /dev/null\" to \"dev/null\" and aborts with\n#   error: dev/null: No such file or directory\n# (reproduced locally with git 2.55). Nothing else in the build is touched; the rest of\n# the\
        \ patch and all 81 kernel patches apply cleanly.\nset -uo pipefail\nmkdir -p \"$DIAG\"\nL=\"$DIAG/08a-mesa-patch.txt\"\nexec > >(tee -a \"$L\") 2>&1\nset -e\np=\"$WORK/UniXNU/patches/mesa/turnip-frame-diagnostics.patch\"\
        \n[ -f \"$p\" ] || { echo \"missing $p\"; exit 1; }\nshasum -a 256 \"$p\"\npython3 - \"$p\" <<'PY'\nimport sys, pathlib\npath = pathlib.Path(sys.argv[1])\ntext = path.read_text()\nmarker = 'diff\
        \ --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\\n--- /dev/null'\npatched = 'diff --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\\\
        nnew file mode 100644\\n--- /dev/null'\nif 'new file mode 100644\\n--- /dev/null' in text:\n    print('already carries new file mode; nothing to do')\nelif marker not in text:\n    raise SystemExit('unexpected\
        \ patch layout; refusing to rewrite')\nelse:\n    path.write_text(text.replace(marker, patched, 1))\n    print('inserted \"new file mode 100644\" for tu_frame_diagnostic.h')\nPY\nshasum -a 256 \"\
        $p\"\nsed -n '1,6p' \"$p\"\n"
    - name: package
      script: "set -uo pipefail\nmkdir -p \"$DIAG\"\nL=\"$DIAG/08-package.txt\"\nexec > >(tee -a \"$L\") 2>&1\nset -e\n# $CM_ENV appends were not visible to later steps, so build the PATH here as well.\n\
        # cargo/rustc live in the keg-only rustup prefix; ipsw went to ~/.local/bin.\nRUSTUP_BIN=\"$(brew --prefix rustup 2>/dev/null)/bin\"\nexport PATH=\"/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:/opt/homebrew/opt/bison/bin:$HOME/.cargo/bin:$RUSTUP_BIN:$HOME/.local/bin:$PATH\"\
        \necho \"PATH=$PATH\"\necho \"cargo -> $(command -v cargo || echo MISSING)\"\necho \"rustc -> $(command -v rustc || echo MISSING)\"\necho \"ipsw  -> $(command -v ipsw || echo MISSING)\"\ncommand\
        \ -v cargo >/dev/null || { echo 'cargo still missing; aborting before a 40-minute build' >&2; exit 1; }\ncd \"$WORK/device\"\n# BaseTools is built by package/build.sh with `make -j$(nproc) >/dev/null`;\
        \ on this EDK2\n# feed (mu_basecore cfb93724) the parallel host-tools build can lose the VfrCompile link\n# race and abort with a message that is swallowed by that >/dev/null. The same commit\n\
        # builds cleanly serially (probe run 11-13 16:0x). Keep the default parallelism for the\n# main build, but if package fails, finish BaseTools serially and retry once.\nexport JOBS=\"${JOBS:-4}\"\
        \nset +e\nscripts/package.sh --os 17 --uefi ../uefi-sheng\nrc=$?\nif [ $rc -ne 0 ]; then\n  echo \"== package.sh failed rc=$rc; repairing BaseTools serially\"\n  for d in \"$WORK\"/UniXNU/out/feeds/mu_basecore-*/BaseTools/Source/C;\
        \ do\n    [ -d \"$d\" ] || continue\n    echo \"== serial make -C $d -j1\"\n    make -C \"$d\" -j1 >> \"$DIAG/08b-basetools.txt\" 2>&1\n    echo \"serial make rc=$? GenFw=$([ -x \"$d/bin/GenFw\"\
        \ ] && echo yes || echo no)\"\n  done\n  R=\"$WORK/UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27\"\n  for f in \"$R/logs/package.log\" \"$R/logs/runtime.log\"; do\n    [ -f \"$f\" ] && tail\
        \ -200 \"$f\" > \"$DIAG/08c-$(basename \"$f\").txt\"\n  done\n  echo \"== retry package.sh once\"\n  scripts/package.sh --os 17 --uefi ../uefi-sheng\n  rc=$?\nfi\nexit $rc\n"
    - name: collect outputs
      script: "set -uo pipefail\nmkdir -p \"$DIAG\" \"$CM_BUILD_DIR/out\"\nL=\"$DIAG/09-outputs.txt\"\nexec > >(tee -a \"$L\") 2>&1\nroot=\"$WORK/UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27\"\n\
        echo \"== tree under $root ==\"\nfind \"$root\" -maxdepth 2 -type f \\( -name 'boot.img' -o -name 'payload.img' -o -name 'kernel.macho' -o -name '*.json' \\) -print -exec ls -l {} \\; 2>/dev/null\
        \ || true\nrc=0\nfor f in boot/boot.img payload/payload.img kernel/kernel.macho package.manifest.json; do\n  if [ -f \"$root/$f\" ]; then\n    cp \"$root/$f\" \"$CM_BUILD_DIR/out/$(basename \"$f\"\
        )\"\n  else\n    echo \"MISSING $f\"; rc=1\n  fi\ndone\nfor f in \"$CM_BUILD_DIR\"/out/*; do [ -f \"$f\" ] && shasum -a 256 \"$f\"; done\nls -l \"$CM_BUILD_DIR/out\"\nexit $rc\n"
